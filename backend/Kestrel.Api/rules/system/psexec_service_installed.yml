title: PsExec Service Installation (PSEXESVC)
id: 1a9c7e10-4d55-4f2b-9c3e-8b7a6d5c4e03
status: stable
description: >-
    Detects installation of the Sysinternals PsExec service (PSEXESVC, Event ID
    7045). Legitimate for administrators, but it is also the default service name
    used by PsExec-style lateral movement tooling.
references:
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-7045
author: Kestrel Core Rule Pack
date: 2026-02-01
logsource:
    product: windows
    service: system
detection:
    selection:
        EventID: 7045
        ServiceName|contains: 'PSEXESVC'
    condition: selection
fields:
    - ServiceName
    - ImagePath
    - ServiceType
falsepositives:
    - Authorized remote administration with the Sysinternals PsExec utility
level: high
tags:
    - attack.lateral_movement
    - attack.execution
    - attack.t1021.002
    - attack.t1569.002
