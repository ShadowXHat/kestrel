title: LSASS Process Memory Access (Credential Dumping)
id: 8b5d1f60-7c92-4a48-8b23-5d9e1c4a7f31
status: experimental
description: |
  Detects a process opening a handle to lsass.exe with the access masks
  commonly used by credential-dumping tools (Sysmon EventID 10).
  Mimikatz, procdump -ma lsass.exe and Cobalt Strike's hashdump all leave
  this footprint.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Kestrel Rule Pack
date: 2026/03/01
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  filter_known_source:
    SourceImage|endswith:
      - '\svchost.exe'
      - '\MsMpEng.exe'
      - '\csrss.exe'
  condition: selection and not filter_known_source
level: critical
falsepositives:
  - Endpoint protection / EDR userland sensors reading LSASS memory
  - Backup agents configured to snapshot LSASS (rare, should be documented)
