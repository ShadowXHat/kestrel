title: Encoded or Hidden PowerShell Command Line
id: 2f7c9a13-6b48-4d7e-8f15-3a0c7d2e5b94
status: stable
description: |
  Detects PowerShell launched with an encoded command, a hidden window or
  a no-profile / bypass execution policy. Encoding is the standard way to
  obfuscate payloads in fileless execution chains.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_powershell_exe
author: Kestrel Rule Pack
date: 2026/03/01
tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1059.001
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_process_creation:
    EventID: 4688
    NewProcessName|endswith: '\powershell.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
      - ' -e '
      - ' -ExecutionPolicy Bypass'
      - ' -nop '
      - ' -w hidden'
  selection_sysmon:
    EventID: 1
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
      - ' -e '
      - ' -ExecutionPolicy Bypass'
      - ' -nop '
      - ' -w hidden'
  condition: selection_process_creation or selection_sysmon
level: high
falsepositives:
  - Software deployment / configuration management agents that wrap PowerShell
  - Signed admin scripts using -ExecutionPolicy Bypass without encoding
