title: Windows Event Log Cleared
id: 6a8f2c74-1e35-4c0b-9c1d-2f4b8e9a5d10
status: stable
description: |
  Detects clearing of a Windows event log (Security 1102, System 104).
  Attackers clear logs to destroy evidence of their activity — this is a
  high-confidence defense-evasion signal on any monitored host.
references:
  - https://attack.mitre.org/techniques/T1070/001/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-1102
author: Kestrel Rule Pack
date: 2026/03/01
tags:
  - attack.defense_evasion
  - attack.t1070.001
logsource:
  product: windows
detection:
  selection_security:
    Channel: Security
    EventID: 1102
  selection_system:
    Channel: System
    EventID: 104
  condition: 1 of selection_*
level: high
falsepositives:
  - Planned log maintenance / retention tooling (should be ticketed work)
