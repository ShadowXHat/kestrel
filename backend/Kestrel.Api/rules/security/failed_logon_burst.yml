title: Failed Logon Burst for a Single Account
id: 3a6c1e8f-5b47-4c92-8d16-9f2b4a7c5e83
status: test
description: |
  Detects a failed interactive or network logon (Security 4625) for an
  account that is not a machine account. This rule is intentionally kept
  single-event: correlation into bursts (same account, N failures within a
  window) is Phase 11 work, so triage should treat a single hit as a
  signal to check the surrounding volume.
references:
  - https://attack.mitre.org/techniques/T1110/
author: Kestrel Rule Pack
date: 2026/03/01
tags:
  - attack.credential_access
  - attack.t1110
logsource:
  product: windows
  service: security
detection:
  selection:
    Channel: Security
    EventID: 4625
  filter_machine_account:
    TargetUserName|endswith: '$'
  filter_known_netlogon:
    TargetUserName|endswith:
      - 'ANONYMOUS LOGON'
      - 'DefaultAccount'
  condition: selection and not filter_machine_account and not filter_known_netlogon
level: low
falsepositives:
  - Users mistyping passwords (check volume before escalating)
  - Cached-credential failures after a documented password rollover
