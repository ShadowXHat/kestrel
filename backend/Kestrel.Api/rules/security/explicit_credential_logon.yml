title: Explicit Credential Use for a Remote Logon
id: 1c9e46b7-83a2-4d15-b6f0-2e7a5c8d9b31
status: experimental
description: |
  Detects a process explicitly supplying credentials for a logon
  (Security 4648) against a remote target. Used by runas /Password,
  PsExec-class tooling and RDP session hijacking tradecraft.
references:
  - https://attack.mitre.org/techniques/T1078/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4648
author: Kestrel Rule Pack
date: 2026/03/01
tags:
  - attack.defense_evasion
  - attack.lateral_movement
  - attack.t1078
logsource:
  product: windows
  service: security
detection:
  selection:
    Channel: Security
    EventID: 4648
  filter_loopback_targets:
    TargetServerName|contains:
      - 'localhost'
      - '127.0.0.1'
  filter_machine_account:
    SubjectUserName|endswith: '$'
  condition: selection and not filter_loopback_targets and not filter_machine_account
level: medium
falsepositives:
  - Scheduled tasks and services running under stored credentials
  - Password managers performing documented automation logons
